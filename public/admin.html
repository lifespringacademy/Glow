<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Glow admin</title>
<meta name="theme-color" content="#0B1220">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap">
<style>
:root{--night:#0B1220;--panel:#111A2E;--line:#24304A;--snow:#F4F6FB;--frost:#B8C2D8;--dim:#8E9AB5;--amber:#FFB347;--red:#FF4D5E;--green:#2FD08A;--gold:#FFD24A;--copper:#FFB27A;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--snow);font-family:"Outfit",system-ui,sans-serif;font-size:15px;line-height:1.45;padding:16px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:16px}
h1{font-family:"Fredoka",system-ui,sans-serif;font-weight:700;font-size:30px;margin:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-weight:600;color:var(--frost)}
.tabs button[aria-pressed="true"]{background:var(--snow);color:var(--night)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--frost);font-size:13px;align-items:center}
.badge{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:3px 7px}
.b-pend{background:#3A2F0C;color:var(--amber)} .b-ok{background:#0F3326;color:var(--green)} .b-no{background:#3B1520;color:#FF98A2}
.b-feat{background:#3A2F0C;color:var(--gold)} .b-spot{background:#3A2012;color:var(--copper)} .b-paid{background:#0F3326;color:var(--green)}
.btn{border:1px solid var(--line);background:var(--night);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;color:var(--snow);text-decoration:none}
.btn.primary{background:var(--amber);color:#2A1700;border-color:var(--amber)}
.btn.danger{border-color:#7A2A35;color:#FF98A2}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.field{display:grid;gap:4px;min-width:0}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);font-weight:700}
input[type=text],input[type=password],input[type=search],input[type=date],input[type=number],select,textarea{background:var(--night);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:64px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px}
.checks label{display:flex;gap:6px;align-items:center;font-size:14px}
.err{color:#FF98A2;font-size:14px} .note{font-size:12px;color:var(--dim)}
.ok{color:var(--green);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tablebox{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.backdrop{position:fixed;inset:0;background:#02060fcc;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:720px;width:100%;max-height:92vh;overflow:auto;padding:18px;display:grid;gap:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--snow);color:var(--night);font-weight:600;padding:10px 16px;border-radius:999px;z-index:60}
</style>
</head>
<body>
<div class="wrap">
  <div class="meta" style="justify-content:space-between"><h1>Glow admin</h1><a class="btn" href="/">Open the app</a></div>

  <form class="card" id="login" style="max-width:420px">
    <div class="field"><label class="label" for="pw">Admin password</label><input type="password" id="pw" autocomplete="current-password"></div>
    <div class="actions"><button class="btn primary" type="submit">Sign in</button></div>
    <div id="loginMsg"></div>
    <div class="note">This is the ADMIN_KEY you set in Vercel.</div>
  </form>

  <div id="app" hidden style="display:grid;gap:16px">
    <div class="tabs" id="tabs">
      <button type="button" data-t="pending" aria-pressed="true">Waiting for review <span id="pendCount"></span></button>
      <button type="button" data-t="all" aria-pressed="false">All displays</button>
      <button type="button" data-t="add" aria-pressed="false">Add a display</button>
      <button type="button" data-t="import" aria-pressed="false">Import CSV</button>
      <button type="button" data-t="messages" aria-pressed="false">Messages <span id="msgCount"></span></button>
      <button type="button" data-t="teams" aria-pressed="false">Hunt teams</button>
      <button type="button" data-t="stats" aria-pressed="false">Stats</button>
      <button type="button" id="signout">Sign out</button>
    </div>
    <div id="view"></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TYPES={home:"Home display",hood:"Neighborhood",drive:"Drive-thru",walk:"Walk-through",music:"Music light show",town:"Town event",ride:"Hayride or train"};
const SITE="https://letsglowwww.com", OWNER_NAME="Dawn";   // used in the outreach email
const AMEN=["Santa visits","Hot cocoa","Wheelchair friendly","Stroller friendly","Pets welcome","Restrooms","Synced to FM"];
const PLANS={home:"Home (free)",spot:"Home + Spotlight",basic:"Business basic",featured:"Featured business"};
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
let KEY=""; try{ KEY=sessionStorage.getItem("glow-admin")||""; }catch(e){}
let tab="pending", rows=[], search="";

async function api(path,opts={}){
  const r=await fetch(path,{method:opts.method||"GET",headers:{"Content-Type":"application/json","x-admin-key":KEY},body:opts.body?JSON.stringify(opts.body):undefined});
  let d={}; try{ d=await r.json(); }catch(e){}
  if(!r.ok) throw Object.assign(new Error(d.error||"Something went wrong."),{status:r.status});
  return d;
}
function toast(m){ document.querySelectorAll(".toast").forEach(t=>t.remove()); const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }

$("#login").onsubmit=async e=>{ e.preventDefault(); KEY=$("#pw").value; try{ await api("/api/admin?view=pending"); try{ sessionStorage.setItem("glow-admin",KEY); }catch(_){} start(); }catch(err){ $("#loginMsg").innerHTML=`<div class="err">${esc(err.message)}</div>`; } };
$("#signout").onclick=()=>{ try{ sessionStorage.removeItem("glow-admin"); }catch(e){} location.reload(); };
$("#tabs").onclick=e=>{ const b=e.target.closest("[data-t]"); if(!b) return; tab=b.dataset.t; document.querySelectorAll("#tabs [data-t]").forEach(x=>x.setAttribute("aria-pressed",x===b)); load(); };

function start(){ $("#login").hidden=true; $("#app").hidden=false; load(); }
async function load(){
  const v=$("#view"); v.innerHTML=`<div class="note">Loading…</div>`;
  try{
    if(tab==="teams"){ const r=await api("/api/admin?view=teams"); return renderTeams(r.teams); }
    if(tab==="stats"){ const r=await api("/api/admin?view=stats&range="+statRange); return renderStats(r); }
    if(tab==="messages"){ const r=await api("/api/admin?view=messages"); return renderMessages(r.messages); }
    if(tab==="add"){ return renderForm(null); }
    if(tab==="import"){ return renderImport(); }
    const r=await api("/api/admin?view="+(tab==="pending"?"pending":"all")); rows=r.displays;
    if(tab==="pending"){ $("#pendCount").textContent=rows.length?`(${rows.length})`:""; renderPending(); } else renderAll();
  }catch(err){ if(err.status===401){ try{ sessionStorage.removeItem("glow-admin"); }catch(e){} location.reload(); } v.innerHTML=`<div class="err">${esc(err.message)}</div>`; }
}
function badges(d){ return `<span class="badge ${d.status==="approved"?"b-ok":d.status==="pending"?"b-pend":"b-no"}">${d.status}</span>${d.featured?`<span class="badge b-feat">Featured</span>`:""}${d.spotlight?`<span class="badge b-spot">Spotlight</span>`:""}${d.paid?`<span class="badge b-paid">Paid</span>`:""}${d.lights_out?`<span class="badge b-no">Lights off</span>`:""}${d.claim_email?`<span class="badge b-pend" title="${esc(d.claim_name||"")} ${esc(d.claim_email)}">Claimed</span>`:""}`; }
function renderPending(){
  const v=$("#view");
  if(!rows.length){ v.innerHTML=`<div class="card"><b>Nothing waiting for review.</b><div class="note">New submissions show up here.</div></div>`; return; }
  v.innerHTML=rows.map(d=>`<div class="card">
    <div class="meta">${badges(d)}<span>${esc(TYPES[d.type]||d.type)}</span><span>${esc(PLANS[d.plan]||d.plan)}${(d.plan==="spot"||d.plan==="featured")&&!d.paid?" · not paid yet":""}</span></div>
    <b style="font-size:17px">${esc(d.name)}</b>
    <div class="meta"><span>${esc(d.street||"")}, ${esc(d.city)} ${esc(d.zip||"")}</span><a href="https://www.google.com/maps?q=${d.lat},${d.lon}" target="_blank" rel="noopener">Check on map</a><span>${esc(d.submitter_email||"")}</span></div>
    <div class="meta"><span>${esc(d.price||"")}</span><span>${esc(d.hours||"")}</span>${d.start_date||d.end_date?`<span>${esc(d.start_date||"?")} → ${esc(d.end_date||"?")}</span>`:""}${d.fm?`<span>FM ${esc(d.fm)}</span>`:""}${d.url?`<a href="${esc(d.url)}" target="_blank" rel="noopener">Website</a>`:""}</div>
    ${["home","hood"].includes(d.type)||(["home","spot"].includes(d.plan)&&!["drive","walk","town","ride"].includes(d.type))?`<div class="meta">${d.verified?`<span class="badge b-ok">Verified at location${d.verify_miles!=null?` · ${d.verify_miles} mi`:""}</span>`:`<span class="badge b-pend">Not verified${d.verify_miles!=null?` · ${d.verify_miles} mi from address`:" · no location"}</span>`}${d.owner_confirmed?`<span class="badge b-ok">Owner confirmed</span>`:`<span class="badge b-no">No owner confirmation</span>`}<a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${d.lat},${d.lon}" target="_blank" rel="noopener">Street View</a></div>${d.photo_check?`<div class="note">Photo check: ${esc(d.photo_check)}</div>`:""}`:""}
    ${d.description?`<div style="color:var(--frost)">${esc(d.description)}</div>`:""}
    <div class="actions"><button class="btn primary" data-approve="${d.id}">Approve</button><button class="btn" data-edit="${d.id}">Edit first</button><button class="btn danger" data-reject="${d.id}">Reject</button></div>
  </div>`).join("");
  bindRowButtons();
}
function renderAll(){
  const v=$("#view");
  const q=search.toLowerCase();
  const list=rows.filter(d=>!q||[d.name,d.city,d.street,d.submitter_email].join(" ").toLowerCase().includes(q));
  v.innerHTML=`<div class="field" style="max-width:360px"><label class="label" for="srch">Search</label><input type="search" id="srch" value="${esc(search)}" placeholder="Name, city, email"></div>
  <div class="tablebox" style="margin-top:12px"><table><thead><tr><th>Display</th><th>City</th><th>Status</th><th>Quick changes</th><th></th></tr></thead><tbody>
  ${list.map(d=>`<tr><td><b>${esc(d.name)}</b><div class="note">${esc(TYPES[d.type]||"")} · ${esc(PLANS[d.plan]||"")}</div></td><td>${esc(d.city)}</td><td><div class="meta">${badges(d)}</div></td>
  <td><div class="actions"><button class="btn" data-toggle="featured" data-id="${d.id}">${d.featured?"Unfeature":"Feature"}</button><button class="btn" data-toggle="spotlight" data-id="${d.id}">${d.spotlight?"Remove spotlight":"Spotlight"}</button><button class="btn" data-toggle="lights_out" data-id="${d.id}">${d.lights_out?"Lights back on":"Lights off"}</button></div></td>
  <td><div class="actions"><button class="btn" data-edit="${d.id}">Edit</button>${d.status==="approved"&&d.type!=="home"&&d.type!=="hood"&&!d.featured?`<button class="btn" data-outreach="${d.id}">Outreach email</button>`:""}</div>${d.claim_email?`<div class="note">Claimed by ${esc(d.claim_name||"")} · ${esc(d.claim_email)}</div>`:""}</td></tr>`).join("")||`<tr><td colspan="5" class="note">No displays.</td></tr>`}
  </tbody></table></div>`;
  $("#srch").oninput=e=>{ search=e.target.value; const pos=e.target.selectionStart; renderAll(); const s=$("#srch"); s.focus(); s.setSelectionRange(pos,pos); };
  bindRowButtons();
}
function bindRowButtons(){
  const v=$("#view");
  v.querySelectorAll("[data-approve]").forEach(b=>b.onclick=()=>act({action:"approve",id:+b.dataset.approve},"Approved. It's on the map."));
  v.querySelectorAll("[data-reject]").forEach(b=>b.onclick=()=>{ if(b.dataset.sure) return act({action:"reject",id:+b.dataset.reject},"Rejected"); b.dataset.sure=1; b.textContent="Tap again to reject"; });
  v.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{ const d=rows.find(x=>x.id===+b.dataset.edit); openEdit(d); });
  v.querySelectorAll("[data-outreach]").forEach(b=>b.onclick=()=>openOutreach(rows.find(x=>x.id===+b.dataset.outreach)));
  v.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{ const d=rows.find(x=>x.id===+b.dataset.id); const k=b.dataset.toggle; act({action:"update",id:d.id,fields:{[k]:!d[k]}},"Saved"); });
}
async function act(body,msg){ try{ await api("/api/admin",{method:"POST",body}); toast(msg); load(); }catch(e){ toast(e.message); } }

function formHtml(d){
  d=d||{type:"home",cost:"free",plan:"home",tags:[],days:[]};
  return `<div class="grid">
    <div class="field"><label class="label" for="e_name">Name</label><input type="text" id="e_name" value="${esc(d.name)}"></div>
    <div class="field"><label class="label" for="e_type">Type</label><select id="e_type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${d.type===k?"selected":""}>${v}</option>`).join("")}</select></div>
    <div class="field"><label class="label" for="e_street">Street</label><input type="text" id="e_street" value="${esc(d.street)}"></div>
    <div class="field"><label class="label" for="e_city">City</label><input type="text" id="e_city" value="${esc(d.city)}"></div>
    <div class="field"><label class="label" for="e_zip">ZIP</label><input type="text" id="e_zip" value="${esc(d.zip)}"></div>
    <div class="field"><label class="label" for="e_cost">Cost</label><select id="e_cost"><option value="free" ${d.cost==="free"?"selected":""}>Free</option><option value="paid" ${d.cost==="paid"?"selected":""}>Paid</option></select></div>
    <div class="field"><label class="label" for="e_price">Price text</label><input type="text" id="e_price" value="${esc(d.price)}"></div>
    <div class="field"><label class="label" for="e_hours">Hours</label><input type="text" id="e_hours" value="${esc(d.hours)}"></div>
    <div class="field"><label class="label" for="e_start">First night</label><input type="date" id="e_start" value="${esc(d.start_date)}"></div>
    <div class="field"><label class="label" for="e_end">Last night</label><input type="date" id="e_end" value="${esc(d.end_date)}"></div>
    <div class="field"><label class="label" for="e_fm">FM station</label><input type="text" id="e_fm" value="${esc(d.fm)}"></div>
    <div class="field"><label class="label" for="e_url">Website / tickets</label><input type="text" id="e_url" value="${esc(d.url)}"></div>
    <div class="field"><label class="label" for="e_plan">Plan</label><select id="e_plan">${Object.entries(PLANS).map(([k,v])=>`<option value="${k}" ${d.plan===k?"selected":""}>${v}</option>`).join("")}</select></div>
    <div class="field"><label class="label" for="e_lat">Latitude (optional)</label><input type="text" id="e_lat" value="${d.lat??""}"></div>
    <div class="field"><label class="label" for="e_lon">Longitude (optional)</label><input type="text" id="e_lon" value="${d.lon??""}"></div>
  </div>
  <div class="field"><label class="label" for="e_desc">Description</label><textarea id="e_desc">${esc(d.description)}</textarea></div>
  <div class="field"><span class="label">Extras</span><div class="checks">${AMEN.map((a,i)=>`<label><input type="checkbox" class="e_tag" value="${esc(a)}" ${(d.tags||[]).includes(a)?"checked":""}>${esc(a)}</label>`).join("")}</div></div>
  <div class="field"><span class="label">Open nights (leave all unchecked for every night)</span><div class="checks">${DAYS.map((n,i)=>`<label><input type="checkbox" class="e_day" value="${i}" ${(d.days||[]).includes(i)?"checked":""}>${n}</label>`).join("")}</div></div>
  <div class="checks"><label><input type="checkbox" id="e_featured" ${d.featured?"checked":""}>Featured</label><label><input type="checkbox" id="e_spotlight" ${d.spotlight?"checked":""}>Spotlight (Homeowner Pick)</label><label><input type="checkbox" id="e_paid" ${d.paid?"checked":""}>Paid</label><label><input type="checkbox" id="e_lights" ${d.lights_out?"checked":""}>Lights off for now</label></div>`;
}
function readForm(){
  const v=id=>$(id).value.trim();
  const f={name:v("#e_name"),type:$("#e_type").value,street:v("#e_street"),city:v("#e_city"),zip:v("#e_zip"),cost:$("#e_cost").value,price:v("#e_price"),hours:v("#e_hours"),start_date:$("#e_start").value,end_date:$("#e_end").value,fm:v("#e_fm"),url:v("#e_url"),plan:$("#e_plan").value,description:v("#e_desc"),
    tags:[...document.querySelectorAll(".e_tag:checked")].map(x=>x.value),days:[...document.querySelectorAll(".e_day:checked")].map(x=>+x.value),
    featured:$("#e_featured").checked,spotlight:$("#e_spotlight").checked,paid:$("#e_paid").checked,lights_out:$("#e_lights").checked};
  if(v("#e_lat")&&v("#e_lon")){ f.lat=+v("#e_lat"); f.lon=+v("#e_lon"); }
  return f;
}
function renderForm(){
  $("#view").innerHTML=`<form class="card" id="addf">${formHtml(null)}<div class="note">Leave latitude and longitude empty to look up the address automatically. Displays you add here go on the map right away.</div><div class="actions"><button class="btn primary" type="submit">Add to the map</button></div><div id="addMsg"></div></form>`;
  $("#addf").onsubmit=async e=>{ e.preventDefault(); try{ await api("/api/admin",{method:"POST",body:{action:"create",fields:readForm()}}); toast("Added to the map"); renderForm(); }catch(err){ $("#addMsg").innerHTML=`<div class="err">${esc(err.message)}</div>`; } };
}
function openEdit(d){
  const bd=document.createElement("div"); bd.className="backdrop";
  bd.innerHTML=`<form class="modal" id="editf"><div class="meta" style="justify-content:space-between"><b style="font-size:18px">Edit ${esc(d.name)}</b><button type="button" class="btn" id="eclose">Close</button></div>${formHtml(d)}
    <label class="checks"><span><input type="checkbox" id="e_regeo"> Look up the map location again from the address</span></label>
    <div class="actions"><button class="btn primary" type="submit">Save</button>${d.status!=="approved"?`<button type="button" class="btn" id="esaveapprove">Save and approve</button>`:""}<button type="button" class="btn danger" id="edelete">Delete</button></div><div id="editMsg"></div></form>`;
  document.body.appendChild(bd);
  const close=()=>bd.remove();
  $("#eclose").onclick=close; bd.onclick=e=>{ if(e.target===bd) close(); };
  const save=async(approve)=>{ try{ const f=readForm(); if($("#e_regeo").checked){ f.regeocode=true; delete f.lat; delete f.lon; } await api("/api/admin",{method:"POST",body:{action:"update",id:d.id,fields:f}}); if(approve) await api("/api/admin",{method:"POST",body:{action:"approve",id:d.id}}); close(); toast(approve?"Saved and approved":"Saved"); load(); }catch(err){ $("#editMsg").innerHTML=`<div class="err">${esc(err.message)}</div>`; } };
  $("#editf").onsubmit=e=>{ e.preventDefault(); save(false); };
  const sa=$("#esaveapprove"); if(sa) sa.onclick=()=>save(true);
  $("#edelete").onclick=e=>{ const b=e.currentTarget; if(!b.dataset.sure){ b.dataset.sure=1; b.textContent="Tap again to delete for good"; return; } close(); act({action:"delete",id:d.id},"Deleted"); };
}
// ---------- outreach email for a business listing ----------
function outreachText(d,st){
  const listing=`${SITE}/?listing=${d.id}`, claim=`${SITE}/?claim=${d.id}`;
  const proof = st && st.view>=10 ? `\nSince October 1, families have viewed ${d.name} on Glow ${st.view.toLocaleString()} times${st.directions?` and tapped for directions ${st.directions.toLocaleString()} times`:""}.\n` : "";
  return {subject:`${d.name} is on Glow, the NC Christmas lights map`,
  body:`Hi ${d.name} team,

I'm ${OWNER_NAME}, and I run Glow (letsglowwww.com), a new map that helps North Carolina families find Christmas light displays, check live wait times and plan a route for the night.

${d.name} is already on the map, free:
${listing}
${proof}
For $49 for the whole season, you can make it a Featured listing:
- A gold pin and Featured badge on the map
- The top spot when families search nearby
- A "Buy tickets" button on your listing
- A bonus stop in our Family Hunt, a scavenger-hunt competition that sends families out to visit displays

You can upgrade in about a minute here:
${claim}

If any of your details need fixing (dates, hours, prices or your website), just reply and I'll update them.

Thanks, and happy holidays!
${OWNER_NAME}
Glow · letsglowwww.com`};
}
async function openOutreach(d){
  let st=null; try{ if(!SEASON) SEASON=await api("/api/admin?view=stats&range=season"); st=SEASON.listings.find(x=>x.id===d.id); }catch(e){}
  const t=outreachText(d,st);
  const bd=document.createElement("div"); bd.className="backdrop";
  bd.innerHTML=`<div class="modal"><div class="meta" style="justify-content:space-between"><b style="font-size:18px">Outreach email: ${esc(d.name)}</b><button type="button" class="btn" id="oclose">Close</button></div>
    <div class="field"><label class="label" for="osub">Subject</label><input type="text" id="osub" value="${esc(t.subject)}"></div>
    <div class="field"><label class="label" for="obody">Message</label><textarea id="obody" style="min-height:340px">${esc(t.body)}</textarea></div>
    <div class="note">Find the business's email on its website (link: ${d.url?`<a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.url)}</a>`:"none saved"}). Copy this into your email app and send it from your Glow address.</div>
    <div class="actions"><button type="button" class="btn primary" id="ocopy">Copy message</button><button type="button" class="btn" id="ocopys">Copy subject</button></div></div>`;
  document.body.appendChild(bd);
  const copy=async(txt,msg)=>{ try{ await navigator.clipboard.writeText(txt); toast(msg); }catch(e){ toast("Select the text and copy it"); } };
  $("#oclose").onclick=()=>bd.remove(); bd.onclick=e=>{ if(e.target===bd) bd.remove(); };
  $("#ocopy").onclick=()=>copy($("#obody").value,"Message copied"); $("#ocopys").onclick=()=>copy($("#osub").value,"Subject copied");
}

// ---------- import a CSV of displays ----------
function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if(c==='"') q=true; else if(c===','){ row.push(cell); cell=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); if(row.some(x=>x.trim()!=="")) rows.push(row); row=[]; cell=""; }
    else cell+=c; }
  row.push(cell); if(row.some(x=>x.trim()!=="")) rows.push(row);
  if(!rows.length) return [];
  const head=rows[0].map(h=>h.trim().toLowerCase());
  return rows.slice(1).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]??"").trim()])));
}
function renderImport(){
  $("#view").innerHTML=`<div class="card">
    <b style="font-size:17px">Import displays from a CSV file</b>
    <div class="note">Columns: name, type (home, hood, drive, walk, music, town, ride), street, city, zip, lat, lon, cost (free or paid), price, hours, start_date, end_date (YYYY-MM-DD), fm, url, description, tags (separated by ;). Extra columns are ignored. Rows need a street address or lat/lon. Displays already on the map (same name and city) are skipped. Imported displays go live right away.</div>
    <div class="field"><label class="label" for="csvFile">CSV file</label><input type="file" id="csvFile" accept=".csv,text/csv"></div>
    <div id="csvPreview"></div>
  </div>`;
  $("#csvFile").onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    const rows=parseCSV(await f.text());
    const pv=$("#csvPreview");
    if(!rows.length){ pv.innerHTML=`<div class="err">No rows found in that file.</div>`; return; }
    pv.innerHTML=`<div class="tablebox" style="max-height:320px;overflow:auto"><table><thead><tr><th>Name</th><th>Type</th><th>City</th><th>Dates</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(TYPES[r.type]||r.type)}</td><td>${esc(r.city)}</td><td>${esc(r.start_date)} ${r.end_date?"→ "+esc(r.end_date):""}</td></tr>`).join("")}</tbody></table></div>
      <div class="actions" style="margin-top:12px"><button class="btn primary" id="doImport">Import ${rows.length} display${rows.length===1?"":"s"}</button></div><div id="impResult"></div>`;
    $("#doImport").onclick=async()=>{
      const btn=$("#doImport"); btn.disabled=true; const out=$("#impResult"); const all=[];
      for(let i=0;i<rows.length;i+=10){
        btn.textContent=`Importing ${Math.min(i+10,rows.length)} of ${rows.length}…`;
        try{ const r=await api("/api/admin",{method:"POST",body:{action:"import",rows:rows.slice(i,i+10)}}); all.push(...r.results); }
        catch(err){ rows.slice(i,i+10).forEach(x=>all.push({name:x.name,ok:false,error:err.message})); }
      }
      const ok=all.filter(r=>r.ok).length, sk=all.filter(r=>r.skipped).length, bad=all.length-ok-sk;
      btn.textContent="Done";
      out.innerHTML=`<p class="ok">${ok} added${sk?`, ${sk} already on the map`:""}${bad?`, <span class="err">${bad} need attention</span>`:""}.</p>
        ${bad?`<div class="tablebox"><table><thead><tr><th>Display</th><th>Problem</th></tr></thead><tbody>${all.filter(r=>!r.ok&&!r.skipped).map(r=>`<tr><td>${esc(r.name)}</td><td class="err">${esc(r.error)}</td></tr>`).join("")}</tbody></table></div><p class="note">Fix these in the file and import it again. Rows that worked will be skipped.</p>`:""}`;
    };
  };
}
function renderMessages(list){
  const open=list.filter(m=>!m.handled).length; $("#msgCount").textContent=open?`(${open})`:"";
  $("#view").innerHTML = list.length ? list.map(m=>`<div class="card" style="${m.handled?"opacity:.6":""}">
    <div class="meta"><span class="badge ${m.handled?"b-ok":"b-pend"}">${m.handled?"Handled":"New"}</span><span>${esc(m.topic)}</span><span>${new Date(m.created_at).toLocaleString()}</span>${m.emailed?"":`<span class="badge b-no" title="Check RESEND_API_KEY and CONTACT_TO in Vercel">Not emailed</span>`}</div>
    <b>${esc(m.name)}</b><div class="meta"><span style="user-select:all">${esc(m.email)}</span>${m.displays?`<span>About: <b>${esc(m.displays.name)}</b> (${esc(m.displays.city)})</span>`:""}</div>
    <div style="white-space:pre-wrap;color:var(--frost)">${esc(m.message)}</div>
    <div class="actions"><button class="btn" data-handled="${m.id}" data-v="${m.handled?0:1}">${m.handled?"Mark as new":"Mark handled"}</button></div></div>`).join("")
    : `<div class="card"><b>No messages yet.</b><div class="note">Messages from the Contact form show up here and are emailed to you.</div></div>`;
  document.querySelectorAll("[data-handled]").forEach(b=>b.onclick=()=>act({action:"handled",id:+b.dataset.handled,value:b.dataset.v==="1"},"Saved"));
}
function renderTeams(teams){
  const shown=teams.filter(t=>t.paid&&!t.hidden).length, hidden=teams.filter(t=>t.hidden).length;
  $("#view").innerHTML=`<div class="meta"><span>${teams.filter(t=>t.paid).length} paid teams · ${teams.length} total${hidden?` · ${hidden} hidden`:""}</span></div>
  <div class="note" style="margin-top:6px">Hidden teams keep playing and keep their points, but they don't appear on any leaderboard. Rename a team if its name isn't family friendly.</div>
  <div class="tablebox" style="margin-top:12px"><table><thead><tr><th>#</th><th>Team</th><th>County</th><th>Points</th><th>Hunt Pass</th><th>Actions</th></tr></thead><tbody>
  ${teams.map((t,i)=>`<tr${t.hidden?' style="opacity:.6"':""}><td>${i+1}</td><td>${esc(t.name)}${t.hidden?' <span class="badge b-no">Hidden</span>':""}</td><td>${esc(t.county)}</td><td>${t.points}</td><td>${t.paid?'<span class="badge b-paid">Paid</span>':'<span class="note">Not paid</span>'}</td>
  <td><div class="actions"><button class="btn" data-trename="${t.id}" data-name="${esc(t.name)}">Rename</button><button class="btn" data-thide="${t.id}" data-v="${t.hidden?0:1}">${t.hidden?"Show":"Hide"}</button><button class="btn" data-tpaid="${t.id}" data-v="${t.paid?0:1}">${t.paid?"Mark unpaid":"Mark paid"}</button><button class="btn danger" data-tdel="${t.id}" data-name="${esc(t.name)}">Delete</button></div></td></tr>`).join("")||`<tr><td colspan="6" class="note">No teams yet.</td></tr>`}</tbody></table></div>`;
  const teamAct=async(body,msg)=>{ try{ await api("/api/admin",{method:"POST",body}); toast(msg); load(); }catch(err){ toast(err.message); } };
  document.querySelectorAll("[data-trename]").forEach(b=>b.onclick=()=>{ const n=prompt("New team name (30 characters max):",b.dataset.name); if(n&&n.trim()) teamAct({action:"team_rename",team_id:b.dataset.trename,name:n.trim()},"Team renamed"); });
  document.querySelectorAll("[data-thide]").forEach(b=>b.onclick=()=>teamAct({action:"team_hide",team_id:b.dataset.thide,value:b.dataset.v==="1"},b.dataset.v==="1"?"Team hidden from leaderboards":"Team is back on the leaderboards"));
  document.querySelectorAll("[data-tpaid]").forEach(b=>b.onclick=()=>teamAct({action:"team_paid",team_id:b.dataset.tpaid,value:b.dataset.v==="1"},b.dataset.v==="1"?"Marked paid":"Marked unpaid"));
  document.querySelectorAll("[data-tdel]").forEach(b=>b.onclick=()=>{ if(confirm(`Delete "${b.dataset.name}" and all its points? This can't be undone.`)) teamAct({action:"team_delete",team_id:b.dataset.tdel},"Team deleted"); });
}
// ---------- Stats tab ----------
let statRange="30", SEASON=null, statSort="view";
const EV=[["view","Views"],["pin","Map taps"],["directions","Directions"],["website","Website"],["tour","Tour adds"]];
function fmtDay(iso){ const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("en-US",{month:"short",day:"numeric"}); }
function statSummary(d,r){
  const label=r.range==="season"?`since ${fmtDay(r.from)}`:`${fmtDay(r.from)} to ${fmtDay(r.to)}`;
  return `${d.name} on Glow, ${label}:\n- ${d.view.toLocaleString()} listing views\n- ${d.pin.toLocaleString()} map pin taps\n- ${d.directions.toLocaleString()} taps for directions\n${d.url?`- ${d.website.toLocaleString()} clicks to your website or tickets\n`:""}- Added to ${d.tour.toLocaleString()} family tour plans\n\nThanks for being part of Glow!\n${OWNER_NAME} · letsglowwww.com`;
}
function renderStats(r){
  r.range=statRange;
  const max=Math.max(1,...r.daily.map(x=>x.view));
  const W=Math.max(1,r.daily.length), bw=100/W;
  const bars=r.daily.map((x,i)=>{ const h=x.view/max*100; return `<rect x="${(i*bw+bw*0.15).toFixed(2)}%" y="${(100-h).toFixed(2)}%" width="${(bw*0.7).toFixed(2)}%" height="${h.toFixed(2)}%" rx="2" fill="var(--amber)"><title>${fmtDay(x.day)}: ${x.view} views, ${x.directions} directions</title></rect>`; }).join("");
  const list=[...r.listings].sort((a,b)=>b[statSort]-a[statSort]||b.view-a.view);
  $("#view").innerHTML=`
  <div class="meta" style="justify-content:space-between;flex-wrap:wrap;gap:10px">
    <div class="tabs" id="srange">${[["7","Last 7 days"],["30","Last 30 days"],["season","This season"]].map(([v,l])=>`<button type="button" data-r="${v}" aria-pressed="${statRange===v}">${l}</button>`).join("")}</div>
    <span class="note">${fmtDay(r.from)} – ${fmtDay(r.to)} · each phone counts once per listing per day</span>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px">
    ${EV.map(([k,l])=>`<div class="card" style="padding:14px"><div class="note">${l}</div><div style="font-size:28px;font-weight:700">${(r.totals[k]||0).toLocaleString()}</div></div>`).join("")}
  </div>
  <div class="card" style="margin-top:12px"><div class="meta" style="justify-content:space-between"><b>Listing views per day</b><span class="note">Busiest day: ${max>1||r.daily.some(x=>x.view)?`${fmtDay(r.daily.reduce((a,b)=>b.view>a.view?b:a).day)} (${max.toLocaleString()})`:"none yet"}</span></div>
    <svg width="100%" height="140" role="img" aria-label="Listing views per day" style="display:block;margin-top:8px">${bars}</svg>
    <div class="meta" style="justify-content:space-between"><span class="note">${fmtDay(r.from)}</span><span class="note">${fmtDay(r.to)}</span></div>
  </div>
  <div class="tablebox" style="margin-top:12px"><table><thead><tr><th>#</th><th>Display</th>${EV.map(([k,l])=>`<th><button type="button" class="linkish" data-sort="${k}" style="background:none;border:0;color:${statSort===k?"var(--amber)":"inherit"};font:inherit;cursor:pointer;padding:0">${l}${statSort===k?" ↓":""}</button></th>`).join("")}<th></th></tr></thead><tbody>
  ${list.map((d,i)=>`<tr><td>${i+1}</td><td><b>${esc(d.name)}</b><div class="note">${esc(d.city)} · ${esc(TYPES[d.type]||d.type)}${d.featured?' · <span style="color:var(--gold)">Featured</span>':""}${d.spotlight?' · <span style="color:var(--copper)">Spotlight</span>':""}</div></td>${EV.map(([k])=>`<td>${d[k].toLocaleString()}</td>`).join("")}<td><button class="btn" data-ssum="${d.id}">Copy summary</button></td></tr>`).join("")||`<tr><td colspan="8" class="note">No activity yet. Numbers appear as people open listings, tap pins and get directions.</td></tr>`}
  </tbody></table></div>
  <div class="note" style="margin-top:8px">"Copy summary" gives you a short stats message to send a business, for example a Featured listing at the end of the month.</div>`;
  $("#srange").onclick=e=>{ const b=e.target.closest("[data-r]"); if(!b) return; statRange=b.dataset.r; load(); };
  document.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{ statSort=b.dataset.sort; renderStats(r); });
  document.querySelectorAll("[data-ssum]").forEach(b=>b.onclick=async()=>{ const d=r.listings.find(x=>x.id===+b.dataset.ssum); try{ await navigator.clipboard.writeText(statSummary(d,r)); toast("Summary copied"); }catch(e){ toast("Couldn't copy. Try again."); } });
}
